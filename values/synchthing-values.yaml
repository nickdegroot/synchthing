ingress:
  main:
    enabled: true
    className: traefik

    hosts:
      - host: syncthing.lan
        paths:
          - path: /
            pathType: Prefix

    service:
      name: syncthing
      port: 8384   # ✅ ONLY the web UI

service:
  main:
    type: NodePort

    ports:
      listen:
        port: 22000
        targetPort: 22000
        nodePort: 32200   # must be in 30000–32767 range

persistence:
  config:
    enabled: true
    storageClass: local-path
    size: 10Gi
